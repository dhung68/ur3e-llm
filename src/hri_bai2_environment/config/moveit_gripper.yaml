# Overlay on the UR configs, loaded by bai2_moveit.launch.py.
controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints: [left_finger_joint, right_finger_joint]
joint_limits:
  left_finger_joint:
    has_velocity_limits: true
    max_velocity: 0.02
    has_acceleration_limits: true
    max_acceleration: 0.04
  right_finger_joint:
    has_velocity_limits: true
    max_velocity: 0.02
    has_acceleration_limits: true
    max_acceleration: 0.04
